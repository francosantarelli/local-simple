<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="container">
        <div class="auth-brand">local-simple</div>
        <div class="card">
          <h1>Iniciar sesión</h1>
          <form id="login-form" novalidate>
            <div class="field">
              <label for="username">Usuario</label>
              <input id="username" name="username" type="text" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="password">Contraseña</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <p id="login-error" class="error-message" role="alert" hidden></p>
            <button type="submit" class="primary">Ingresar</button>
          </form>
          <p><a href="./recuperar-password.html">Olvidé mi contraseña</a></p>
        </div>
      </main>
    </div>

    <script type="module">
      import { sb } from "./js/supabaseClient.js";
      import { createAuthService } from "./js/auth.js";

      const auth = createAuthService(sb);
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("login-error");

      // Si ya hay sesión iniciada, no mostrar el login de nuevo.
      const existingSession = await auth.requireSession();
      if (existingSession) {
        window.location.href = "./ventas.html";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.hidden = true;

        const username = form.username.value;
        const password = form.password.value;
        const { user, error } = await auth.login(username, password);

        if (error || !user) {
          errorEl.textContent =
            "Usuario o contraseña incorrectos. Volvé a intentar.";
          errorEl.hidden = false;
          return;
        }

        window.location.href = "./ventas.html";
      });
    </script>
  </body>
</html>
