<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css?v=14" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="container">
        <div class="auth-brand">
          <span class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h16v5" /><path d="M4 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0" /><path d="M5 9v11h14V9" /><path d="M9 20v-6h6v6" /></svg>
          </span>
          local-simple
        </div>
        <div class="card">
          <h1>Recuperar contraseña</h1>
          <p>Ingresá tu usuario y te enviamos un link para restablecer tu contraseña al email asociado a tu cuenta.</p>
          <form id="recovery-form" novalidate>
            <div class="field">
              <label for="username">Usuario</label>
              <input id="username" name="username" type="text" autocomplete="username" required />
            </div>
            <button type="submit" class="primary">Enviar link de recuperación</button>
          </form>
          <p id="recovery-message" hidden></p>
        </div>
        <p style="text-align: center"><a href="./index.html">Volver a iniciar sesión</a></p>
      </main>
    </div>

    <script type="module">
      import { LOCAL_SIMPLE_CONFIG } from "./js/config.js";

      const form = document.getElementById("recovery-form");
      const messageEl = document.getElementById("recovery-message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = form.username.value;

        let message;
        try {
          const response = await fetch(
            `${LOCAL_SIMPLE_CONFIG.supabaseUrl}/functions/v1/recuperar-password`,
            {
              method: "POST",
              headers: {
                "content-type": "application/json",
                apikey: LOCAL_SIMPLE_CONFIG.supabaseAnonKey,
              },
              body: JSON.stringify({ username }),
            }
          );
          ({ message } = await response.json());
        } catch (err) {
          message = "No se pudo enviar la solicitud por un error de conexión. Volvé a intentar.";
        }

        messageEl.textContent = message;
        messageEl.hidden = false;
        form.reset();
      });
    </script>
  </body>
</html>
