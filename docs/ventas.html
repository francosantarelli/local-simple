<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ventas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css?v=17" />
  </head>
  <body>
    <header class="app-header">
      <a href="./ventas.html" class="brand">
        <span class="brand-icon" id="icon-store"></span>
        <span id="brand-name">local-simple</span>
      </a>
      <nav>
        <a href="./resumen.html"><span id="icon-nav-resumen"></span> Resumen</a>
        <a href="./catalogo.html"><span id="icon-box"></span> Catálogo</a>
        <a href="./ventas.html" aria-current="page"><span id="icon-cart"></span> Venta</a>
        <a href="./listado-ventas.html"><span id="icon-list"></span> Ventas</a>
        <a href="./facturas.html"><span id="icon-document"></span> Facturas</a>
      </nav>
      <div class="header-right">
        <div class="user-menu">
          <button type="button" class="user-chip" id="user-menu-toggle" aria-haspopup="true" aria-expanded="false">
            <span class="avatar" id="user-avatar"></span>
            <span id="user-name"></span>
            <span id="icon-chevron"></span>
          </button>
          <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
            <button type="button" id="logout-link"><span id="icon-logout"></span> Cerrar sesión</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="card">
        <div class="card-header">
          <span class="icon-circle icon-circle--lg" id="icon-cart-lg"></span>
          <div class="card-header-text">
            <h1>Nueva venta</h1>
            <p>Registrá una venta rápidamente</p>
          </div>
        </div>

        <div class="card-body-row">
          <div class="card-body-main">
            <form id="venta-form" novalidate>
              <div class="form-row">
                <div class="form-row-nowrap" id="fecha-cantidad-row">
                  <div class="field">
                    <label for="fecha">Fecha</label>
                    <input id="fecha" name="fecha" type="date" required />
                    <p class="error-message" data-error-for="fecha" hidden></p>
                  </div>
                  <div class="field">
                    <label for="cantidad">Cantidad</label>
                    <div class="stepper">
                      <button type="button" id="cantidad-minus" aria-label="Restar uno"><span id="icon-minus"></span></button>
                      <input id="cantidad" name="cantidad" type="number" min="0" step="any" value="1" required />
                      <button type="button" id="cantidad-plus" aria-label="Sumar uno"><span id="icon-plus"></span></button>
                    </div>
                    <p class="error-message" data-error-for="cantidad" hidden></p>
                  </div>
                </div>
                <div class="field">
                  <label>Medio de pago</label>
                  <div class="radio-group" role="radiogroup" aria-label="Medio de pago">
                    <label class="radio-option">
                      <input type="radio" name="modoPago" value="efectivo" checked />
                      <span id="icon-cash-radio"></span> Efectivo
                    </label>
                    <label class="radio-option">
                      <input type="radio" name="modoPago" value="tarjeta" />
                      <span id="icon-card-radio"></span> Tarjeta
                    </label>
                  </div>
                  <p class="error-message" data-error-for="modoPago" hidden></p>
                </div>
              </div>

              <div class="form-row">
                <div class="field" style="flex: 1 1 100%">
                  <label for="producto">Producto o descripción</label>
                  <div class="field-icon-wrap">
                    <span id="icon-search"></span>
                    <input
                      id="producto"
                      type="text"
                      autocomplete="off"
                      placeholder="Buscar en el catálogo o escribir una descripción…"
                      required
                    />
                    <ul class="autocomplete-list" id="producto-suggestions" hidden></ul>
                  </div>
                  <p class="error-message" data-error-for="descripcion" hidden></p>
                </div>
              </div>

              <div class="form-row">
                <div class="field">
                  <label for="precioUnitario">Precio unitario</label>
                  <div class="field-icon-wrap currency"><input id="precioUnitario" name="precioUnitario" type="number" min="0" step="any" required /></div>
                  <p class="error-message" data-error-for="precioUnitario" hidden></p>
                </div>
              </div>

              <div class="total-box">
                <label for="precioTotal">Total de venta</label>
                <input id="precioTotal" name="precioTotal" type="number" min="0" step="any" />
                <p class="error-message" data-error-for="precioTotal" hidden></p>
              </div>

              <p id="venta-feedback" hidden></p>
              <button type="submit" class="primary"><span id="icon-check"></span> Guardar venta</button>
            </form>
          </div>

          <div class="illustration" aria-hidden="true">
            <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
              <rect x="40" y="50" width="120" height="90" rx="14" fill="currentColor" opacity="0.15" />
              <rect x="55" y="35" width="90" height="30" rx="6" fill="currentColor" opacity="0.35" />
              <rect x="65" y="70" width="70" height="34" rx="4" fill="currentColor" opacity="0.5" />
              <circle cx="75" cy="118" r="6" fill="currentColor" opacity="0.6" />
              <circle cx="95" cy="118" r="6" fill="currentColor" opacity="0.6" />
              <circle cx="115" cy="118" r="6" fill="currentColor" opacity="0.6" />
              <circle cx="135" cy="118" r="6" fill="currentColor" opacity="0.6" />
            </svg>
          </div>
        </div>
      </div>
    </main>

    <nav class="mobile-tabbar" aria-label="Navegación mobile">
      <a href="./resumen.html" class="mobile-tabbar-item"><span id="icon-tab-resumen"></span>Resumen</a>
      <a href="./catalogo.html" class="mobile-tabbar-item"><span id="icon-tab-catalogo"></span>Catálogo</a>
      <div class="mobile-tabbar-fab-wrap">
        <a href="./ventas.html" class="mobile-tabbar-fab">
          <span class="mobile-tabbar-fab-icon" id="icon-tab-ventas"></span>
          Venta
        </a>
      </div>
      <a href="./listado-ventas.html" class="mobile-tabbar-item"><span id="icon-tab-listado"></span>Ventas</a>
      <a href="./facturas.html" class="mobile-tabbar-item"><span id="icon-tab-facturas"></span>Facturas</a>
    </nav>

    <script type="module">
      import { sb } from "./js/supabaseClient.js";
      import { createAuthService } from "./js/auth.js";
      import { createVentasService, calcularPrecioTotal } from "./js/ventas.js";
      import { icons } from "./js/icons.js";
      import { LOCAL_SIMPLE_CONFIG } from "./js/config.js";

      for (const [id, name] of [
        ["icon-store", "store"],
        ["icon-cart", "cart"],
        ["icon-list", "list"],
        ["icon-document", "document"],
        ["icon-box", "box"],
        ["icon-logout", "logout"],
        ["icon-chevron", "chevronDown"],
        ["icon-nav-resumen", "trendingUp"],
        ["icon-cart-lg", "cart"],
        ["icon-minus", "minus"],
        ["icon-plus", "plus"],
        ["icon-cash-radio", "cash"],
        ["icon-card-radio", "card"],
        ["icon-search", "search"],
        ["icon-check", "check"],
        ["icon-tab-resumen", "trendingUp"],
        ["icon-tab-catalogo", "box"],
        ["icon-tab-ventas", "cart"],
        ["icon-tab-listado", "list"],
        ["icon-tab-facturas", "document"],
      ]) {
        const el = document.getElementById(id);
        if (el) el.innerHTML = icons[name];
      }

      const auth = createAuthService(sb);
      const ventasService = createVentasService(sb, {
        functionsUrl: `${LOCAL_SIMPLE_CONFIG.supabaseUrl}/functions/v1`,
        anonKey: LOCAL_SIMPLE_CONFIG.supabaseAnonKey,
      });

      const session = await auth.requireSession();
      if (!session) {
        window.location.href = "./index.html";
      }

      const { data: profile } = await sb
        .from("profiles")
        .select("local_id, username, locales ( nombre_fantasia )")
        .eq("id", session.user.id)
        .single();
      const localId = profile.local_id;

      document.getElementById("user-avatar").textContent = profile.username.slice(0, 1).toUpperCase();
      document.getElementById("user-name").textContent = profile.username;
      document.getElementById("brand-name").textContent = profile.locales?.nombre_fantasia ?? "local-simple";

      async function cerrarSesion(event) {
        event.preventDefault();
        await auth.logout();
        window.location.href = "./index.html";
      }
      document.getElementById("logout-link").addEventListener("click", cerrarSesion);

      const userMenuToggle = document.getElementById("user-menu-toggle");
      const userMenuDropdown = document.getElementById("user-menu-dropdown");
      userMenuToggle.addEventListener("click", (event) => {
        event.stopPropagation();
        const abierto = !userMenuDropdown.hidden;
        userMenuDropdown.hidden = abierto;
        userMenuToggle.setAttribute("aria-expanded", String(!abierto));
      });
      document.addEventListener("click", () => {
        userMenuDropdown.hidden = true;
        userMenuToggle.setAttribute("aria-expanded", "false");
      });

      // Buscador con autocompletado propio (no <datalist>: en Safari de
      // iOS no muestra sugerencias al tipear, es una limitación conocida
      // de WebKit) del catálogo de productos del local (FR-007). Si se
      // elige una sugerencia se toma como producto (autocompleta precio);
      // si se sigue tipeando sin elegir ninguna, se usa tal cual como
      // descripción libre — no hace falta un toggle aparte.
      const productoInput = document.getElementById("producto");
      const sugerenciasEl = document.getElementById("producto-suggestions");
      const precioUnitarioInput = document.getElementById("precioUnitario");
      const { data: productos } = await ventasService.listarProductos(localId);

      let productoSeleccionado = null;

      function renderSugerencias() {
        const q = productoInput.value.trim().toLowerCase();
        const coincidencias = q
          ? productos.filter((p) => p.nombre.toLowerCase().includes(q)).slice(0, 8)
          : [];

        if (coincidencias.length === 0) {
          sugerenciasEl.hidden = true;
          sugerenciasEl.innerHTML = "";
          return;
        }

        sugerenciasEl.innerHTML = coincidencias
          .map((p) => `<li data-id="${p.id}">${p.nombre} — $${p.precio_unitario}</li>`)
          .join("");
        sugerenciasEl.hidden = false;
      }

      productoInput.addEventListener("input", () => {
        productoSeleccionado = null;
        renderSugerencias();
      });

      productoInput.addEventListener("focus", renderSugerencias);

      // blur dispara antes que el click en la sugerencia; se cierra con
      // mousedown (que sí llega primero) en vez de esperar el blur.
      sugerenciasEl.addEventListener("mousedown", (event) => {
        const li = event.target.closest("li[data-id]");
        if (!li) return;
        event.preventDefault();
        const producto = productos.find((p) => p.id === li.dataset.id);
        if (producto) {
          productoSeleccionado = producto;
          productoInput.value = producto.nombre;
          precioUnitarioInput.value = producto.precio_unitario;
          recalcularTotal();
        }
        sugerenciasEl.hidden = true;
        sugerenciasEl.innerHTML = "";
      });

      productoInput.addEventListener("blur", () => {
        sugerenciasEl.hidden = true;
      });

      // Fecha: hoy por defecto (en huso horario local, no UTC), editable.
      document.getElementById("fecha").value = new Date().toLocaleDateString("en-CA");

      // Cantidad: stepper +/-.
      const cantidadInput = document.getElementById("cantidad");
      document.getElementById("cantidad-minus").addEventListener("click", () => {
        cantidadInput.value = Math.max(1, Number(cantidadInput.value || 1) - 1);
        recalcularTotal();
      });
      document.getElementById("cantidad-plus").addEventListener("click", () => {
        cantidadInput.value = Number(cantidadInput.value || 0) + 1;
        recalcularTotal();
      });

      // Total: se recalcula solo (FR-005) salvo que el usuario lo haya
      // tocado a mano (permite ajustes manuales, ej. descuentos).
      const precioTotalInput = document.getElementById("precioTotal");
      let totalEditadoManualmente = false;
      function recalcularTotal() {
        if (totalEditadoManualmente) return;
        const cantidad = Number(cantidadInput.value);
        const precioUnitario = Number(precioUnitarioInput.value);
        if (cantidad > 0 && precioUnitario > 0) {
          precioTotalInput.value = calcularPrecioTotal(cantidad, precioUnitario);
        }
      }
      cantidadInput.addEventListener("input", recalcularTotal);
      precioUnitarioInput.addEventListener("input", recalcularTotal);
      precioTotalInput.addEventListener("input", () => {
        totalEditadoManualmente = true;
      });

      const form = document.getElementById("venta-form");
      const feedbackEl = document.getElementById("venta-feedback");

      function limpiarErrores() {
        for (const el of form.querySelectorAll("[data-error-for]")) {
          el.hidden = true;
          el.textContent = "";
        }
      }

      function mostrarErrores(errors) {
        for (const [campo, mensaje] of Object.entries(errors)) {
          const el = form.querySelector(`[data-error-for="${campo}"]`);
          if (el) {
            el.textContent = mensaje;
            el.hidden = false;
          } else {
            // Errores sin campo asociado (ej. de red/Supabase): feedback general.
            feedbackEl.textContent = mensaje;
            feedbackEl.hidden = false;
          }
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        limpiarErrores();
        feedbackEl.hidden = true;

        let errors;
        try {
          ({ errors } = await ventasService.crearVenta({
            localId,
            usuarioId: session.user.id,
            productoId: productoSeleccionado?.id || null,
            fecha: form.fecha.value,
            cantidad: form.cantidad.value,
            descripcion: productoInput.value,
            precioUnitario: precioUnitarioInput.value,
            precioTotal: form.precioTotal.value,
            modoPago: form.modoPago.value,
          }));
        } catch (err) {
          mostrarErrores({ red: "No se pudo guardar la venta por un error de conexión. Volvé a intentar." });
          return;
        }

        if (Object.keys(errors).length > 0) {
          mostrarErrores(errors);
          return;
        }

        form.reset();
        form.fecha.value = new Date().toLocaleDateString("en-CA");
        cantidadInput.value = 1;
        totalEditadoManualmente = false;
        productoSeleccionado = null;
        sugerenciasEl.hidden = true;
        sugerenciasEl.innerHTML = "";
        feedbackEl.textContent = "Venta guardada.";
        feedbackEl.hidden = false;
      });
    </script>
  </body>
</html>
