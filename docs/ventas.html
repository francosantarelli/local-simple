<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ventas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css?v=7" />
  </head>
  <body>
    <header class="app-header">
      <a href="./ventas.html" class="brand">
        <span class="brand-icon" id="icon-store"></span>
        local-simple
      </a>
      <nav>
        <a href="./ventas.html" aria-current="page"><span id="icon-cart"></span> Ventas</a>
        <a href="./facturas.html"><span id="icon-document"></span> Facturas</a>
        <a href="./catalogo.html"><span id="icon-box"></span> Catálogo</a>
      </nav>
      <div class="header-right">
        <div class="user-chip">
          <span class="avatar" id="user-avatar"></span>
          <span id="user-name"></span>
        </div>
        <button type="button" class="icon-button" id="logout-link" aria-label="Cerrar sesión" title="Cerrar sesión">
          <span id="icon-logout"></span>
        </button>
      </div>
    </header>

    <main class="container">
      <p id="page-error" class="error-message" role="alert" hidden></p>

      <div class="stat-grid">
        <div class="stat-card">
          <span class="icon-circle icon-circle--sm" id="icon-trending"></span>
          <div>
            <p class="stat-label">Ventas hoy</p>
            <p class="stat-value" id="stat-hoy-monto">$0</p>
            <p class="stat-sub" id="stat-hoy-cantidad">0 ventas</p>
          </div>
        </div>
        <div class="stat-card">
          <span class="icon-circle icon-circle--sm" id="icon-calendar-stat"></span>
          <div>
            <p class="stat-label">Este mes</p>
            <p class="stat-value" id="stat-mes-monto">$0</p>
            <p class="stat-sub" id="stat-mes-cantidad">0 ventas</p>
          </div>
        </div>
        <div class="stat-card">
          <span class="icon-circle icon-circle--sm icon-circle--warning" id="icon-clock"></span>
          <div>
            <p class="stat-label">Pendientes</p>
            <p class="stat-value" id="stat-pendientes">0</p>
            <p class="stat-sub">por facturar</p>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="icon-circle icon-circle--lg" id="icon-cart-lg"></span>
          <div class="card-header-text">
            <h1>Nueva venta</h1>
            <p>Registrá una venta rápidamente</p>
          </div>
        </div>

        <div class="card-body-row">
          <div class="card-body-main">
            <form id="venta-form" novalidate>
              <div class="form-row">
                <div class="field">
                  <label for="fecha">Fecha</label>
                  <div class="field-icon-wrap"><span id="icon-calendar"></span><input id="fecha" name="fecha" type="date" required /></div>
                  <p class="error-message" data-error-for="fecha" hidden></p>
                </div>
                <div class="field">
                  <label for="cantidad">Cantidad</label>
                  <div class="stepper">
                    <button type="button" id="cantidad-minus" aria-label="Restar uno"><span id="icon-minus"></span></button>
                    <input id="cantidad" name="cantidad" type="number" min="0" step="any" value="1" required />
                    <button type="button" id="cantidad-plus" aria-label="Sumar uno"><span id="icon-plus"></span></button>
                  </div>
                  <p class="error-message" data-error-for="cantidad" hidden></p>
                </div>
                <div class="field">
                  <label for="modoPago">Medio de pago</label>
                  <div class="field-icon-wrap">
                    <span id="icon-card"></span>
                    <select id="modoPago" name="modoPago" required>
                      <option value="">Elegir…</option>
                      <option value="efectivo">Efectivo</option>
                      <option value="tarjeta">Tarjeta</option>
                    </select>
                  </div>
                  <p class="error-message" data-error-for="modoPago" hidden></p>
                </div>
              </div>

              <div class="form-row">
                <div class="field" style="flex: 1 1 100%">
                  <label for="producto">Producto o descripción</label>
                  <div class="field-icon-wrap">
                    <span id="icon-search"></span>
                    <input
                      id="producto"
                      type="text"
                      list="productos-datalist"
                      autocomplete="off"
                      placeholder="Buscar en el catálogo o escribir una descripción…"
                      required
                    />
                  </div>
                  <datalist id="productos-datalist"></datalist>
                  <p class="error-message" data-error-for="descripcion" hidden></p>
                </div>
              </div>

              <div class="form-row">
                <div class="field">
                  <label for="precioUnitario">Precio unitario</label>
                  <div class="field-icon-wrap currency"><input id="precioUnitario" name="precioUnitario" type="number" min="0" step="any" required /></div>
                  <p class="error-message" data-error-for="precioUnitario" hidden></p>
                </div>
              </div>

              <div class="total-box">
                <label for="precioTotal">Total de venta</label>
                <input id="precioTotal" name="precioTotal" type="number" min="0" step="any" />
                <p class="error-message" data-error-for="precioTotal" hidden></p>
              </div>

              <p id="venta-feedback" hidden></p>
              <button type="submit" class="primary"><span id="icon-check"></span> Guardar venta</button>
            </form>
          </div>

          <div class="illustration" aria-hidden="true">
            <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
              <rect x="40" y="50" width="120" height="90" rx="14" fill="currentColor" opacity="0.15" />
              <rect x="55" y="35" width="90" height="30" rx="6" fill="currentColor" opacity="0.35" />
              <rect x="65" y="70" width="70" height="34" rx="4" fill="currentColor" opacity="0.5" />
              <circle cx="75" cy="118" r="6" fill="currentColor" opacity="0.6" />
              <circle cx="95" cy="118" r="6" fill="currentColor" opacity="0.6" />
              <circle cx="115" cy="118" r="6" fill="currentColor" opacity="0.6" />
              <circle cx="135" cy="118" r="6" fill="currentColor" opacity="0.6" />
            </svg>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="icon-circle icon-circle--lg" id="icon-document-lg"></span>
          <div class="card-header-text">
            <h2>Ventas</h2>
            <p>Consultá y filtrá tus ventas registradas</p>
          </div>
          <div class="card-header-actions">
            <form id="filtros-form" class="filters" novalidate>
              <div class="field-icon-wrap">
                <span id="icon-calendar-2"></span>
                <label for="filtroDesde" class="sr-only">Desde</label>
                <input id="filtroDesde" name="desde" type="date" title="Desde" />
              </div>
              <div class="field-icon-wrap">
                <span id="icon-calendar-3"></span>
                <label for="filtroHasta" class="sr-only">Hasta</label>
                <input id="filtroHasta" name="hasta" type="date" title="Hasta" />
              </div>
              <div class="field-icon-wrap">
                <span id="icon-card-2"></span>
                <label for="filtroModoPago" class="sr-only">Modo de pago</label>
                <select id="filtroModoPago" name="modoPago" title="Modo de pago">
                  <option value="">Modo de pago</option>
                  <option value="efectivo">Efectivo</option>
                  <option value="tarjeta">Tarjeta</option>
                </select>
              </div>
              <div class="field-icon-wrap">
                <span id="icon-tag"></span>
                <label for="filtroEstado" class="sr-only">Estado</label>
                <select id="filtroEstado" name="estado" title="Estado">
                  <option value="">Estado</option>
                  <option value="no-facturada">No facturada</option>
                  <option value="facturada">Facturada</option>
                </select>
              </div>
              <button type="submit" class="primary"><span id="icon-filter"></span> Filtros</button>
            </form>
          </div>
        </div>

        <div class="selection-bar" id="selection-bar" hidden>
          <span id="selection-count"></span>
          <button type="button" class="primary" id="generar-borrador-btn">
            <span id="icon-check-2"></span> Generar borrador
          </button>
        </div>

        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th style="width: 1%">
                  <input type="checkbox" id="select-all-checkbox" aria-label="Seleccionar todas las ventas no facturadas" />
                </th>
                <th>Fecha</th>
                <th>Descripción</th>
                <th>Cantidad</th>
                <th>Precio unitario</th>
                <th>Precio total</th>
                <th>Modo de pago</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="ventas-tbody"></tbody>
          </table>
        </div>
        <p class="table-footer-note" id="ventas-footer"></p>
      </div>
    </main>

    <script type="module">
      import { sb } from "./js/supabaseClient.js";
      import { createAuthService } from "./js/auth.js";
      import { createVentasService, calcularPrecioTotal, computeStats } from "./js/ventas.js";
      import { icons } from "./js/icons.js";
      import { LOCAL_SIMPLE_CONFIG } from "./js/config.js";

      for (const [id, name] of [
        ["icon-store", "store"],
        ["icon-cart", "cart"],
        ["icon-document", "document"],
        ["icon-box", "box"],
        ["icon-logout", "logout"],
        ["icon-trending", "trendingUp"],
        ["icon-calendar-stat", "calendar"],
        ["icon-clock", "clock"],
        ["icon-cart-lg", "cart"],
        ["icon-calendar", "calendar"],
        ["icon-minus", "minus"],
        ["icon-plus", "plus"],
        ["icon-card", "card"],
        ["icon-search", "search"],
        ["icon-check", "check"],
        ["icon-document-lg", "document"],
        ["icon-calendar-2", "calendar"],
        ["icon-calendar-3", "calendar"],
        ["icon-card-2", "card"],
        ["icon-tag", "tag"],
        ["icon-filter", "filter"],
        ["icon-check-2", "check"],
      ]) {
        document.getElementById(id).innerHTML = icons[name];
      }

      const auth = createAuthService(sb);
      const ventasService = createVentasService(sb, {
        functionsUrl: `${LOCAL_SIMPLE_CONFIG.supabaseUrl}/functions/v1`,
        anonKey: LOCAL_SIMPLE_CONFIG.supabaseAnonKey,
      });

      const session = await auth.requireSession();
      if (!session) {
        window.location.href = "./index.html";
      }

      const { data: profile } = await sb
        .from("profiles")
        .select("local_id, username")
        .eq("id", session.user.id)
        .single();
      const localId = profile.local_id;

      document.getElementById("user-avatar").textContent = profile.username.slice(0, 1).toUpperCase();
      document.getElementById("user-name").textContent = profile.username;

      document.getElementById("logout-link").addEventListener("click", async () => {
        await auth.logout();
        window.location.href = "./index.html";
      });

      // Buscador con autocompletado nativo (datalist) del catálogo de
      // productos del local (FR-007). Si lo tipeado coincide exactamente
      // con una etiqueta del catálogo, se toma como producto elegido
      // (autocompleta precio); si no coincide con nada, se usa tal cual
      // como descripción libre — no hace falta un toggle aparte.
      const productoInput = document.getElementById("producto");
      const productosDatalist = document.getElementById("productos-datalist");
      const precioUnitarioInput = document.getElementById("precioUnitario");
      const { data: productos } = await ventasService.listarProductos(localId);

      const etiquetaPorProducto = (p) => `${p.nombre} — $${p.precio_unitario}`;
      const productoPorEtiqueta = new Map(productos.map((p) => [etiquetaPorProducto(p), p]));
      for (const producto of productos) {
        const option = document.createElement("option");
        option.value = etiquetaPorProducto(producto);
        productosDatalist.appendChild(option);
      }

      let productoSeleccionado = null;
      productoInput.addEventListener("input", () => {
        const match = productoPorEtiqueta.get(productoInput.value);
        if (match) {
          productoSeleccionado = match;
          precioUnitarioInput.value = match.precio_unitario;
          // Reemplaza la etiqueta completa ("Nombre — $Precio") por el
          // nombre limpio: eso es lo que se guarda como descripción.
          productoInput.value = match.nombre;
          recalcularTotal();
        } else {
          productoSeleccionado = null;
        }
      });

      // Cantidad: stepper +/-.
      const cantidadInput = document.getElementById("cantidad");
      document.getElementById("cantidad-minus").addEventListener("click", () => {
        cantidadInput.value = Math.max(1, Number(cantidadInput.value || 1) - 1);
        recalcularTotal();
      });
      document.getElementById("cantidad-plus").addEventListener("click", () => {
        cantidadInput.value = Number(cantidadInput.value || 0) + 1;
        recalcularTotal();
      });

      // Total: se recalcula solo (FR-005) salvo que el usuario lo haya
      // tocado a mano (permite ajustes manuales, ej. descuentos).
      const precioTotalInput = document.getElementById("precioTotal");
      let totalEditadoManualmente = false;
      function recalcularTotal() {
        if (totalEditadoManualmente) return;
        const cantidad = Number(cantidadInput.value);
        const precioUnitario = Number(precioUnitarioInput.value);
        if (cantidad > 0 && precioUnitario > 0) {
          precioTotalInput.value = calcularPrecioTotal(cantidad, precioUnitario);
        }
      }
      cantidadInput.addEventListener("input", recalcularTotal);
      precioUnitarioInput.addEventListener("input", recalcularTotal);
      precioTotalInput.addEventListener("input", () => {
        totalEditadoManualmente = true;
      });

      const form = document.getElementById("venta-form");
      const feedbackEl = document.getElementById("venta-feedback");

      function limpiarErrores() {
        for (const el of form.querySelectorAll("[data-error-for]")) {
          el.hidden = true;
          el.textContent = "";
        }
      }

      function mostrarErrores(errors) {
        for (const [campo, mensaje] of Object.entries(errors)) {
          const el = form.querySelector(`[data-error-for="${campo}"]`);
          if (el) {
            el.textContent = mensaje;
            el.hidden = false;
          } else {
            // Errores sin campo asociado (ej. de red/Supabase): feedback general.
            feedbackEl.textContent = mensaje;
            feedbackEl.hidden = false;
          }
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        limpiarErrores();
        feedbackEl.hidden = true;

        let errors;
        try {
          ({ errors } = await ventasService.crearVenta({
            localId,
            usuarioId: session.user.id,
            productoId: productoSeleccionado?.id || null,
            fecha: form.fecha.value,
            cantidad: form.cantidad.value,
            descripcion: productoInput.value,
            precioUnitario: precioUnitarioInput.value,
            precioTotal: form.precioTotal.value,
            modoPago: form.modoPago.value,
          }));
        } catch (err) {
          mostrarErrores({ red: "No se pudo guardar la venta por un error de conexión. Volvé a intentar." });
          return;
        }

        if (Object.keys(errors).length > 0) {
          mostrarErrores(errors);
          return;
        }

        form.reset();
        cantidadInput.value = 1;
        totalEditadoManualmente = false;
        productoSeleccionado = null;
        feedbackEl.textContent = "Venta guardada.";
        feedbackEl.hidden = false;
        await cargarVentas();
        await cargarStats();
      });

      const tbody = document.getElementById("ventas-tbody");
      const ventasFooterEl = document.getElementById("ventas-footer");
      const selectionBar = document.getElementById("selection-bar");
      const selectionCountEl = document.getElementById("selection-count");
      const selectAllCheckbox = document.getElementById("select-all-checkbox");
      const generarBorradorBtn = document.getElementById("generar-borrador-btn");

      // Solo se puede elegir una venta para un borrador manual si todavía
      // no está reclamada por NINGUNA factura (ni borrador ni emitida) —
      // es una condición más estricta que "no facturada" (que sí incluye
      // ventas ya en un borrador pendiente). Ver contracts/generar-borrador-factura.md.
      const seleccionadas = new Set();

      function actualizarBarraSeleccion() {
        selectionBar.hidden = seleccionadas.size === 0;
        selectionCountEl.textContent = `${seleccionadas.size} ${
          seleccionadas.size === 1 ? "venta seleccionada" : "ventas seleccionadas"
        }`;
      }

      function renderVentas(ventas) {
        tbody.innerHTML = "";
        seleccionadas.clear();
        selectAllCheckbox.checked = false;
        actualizarBarraSeleccion();

        for (const venta of ventas) {
          const facturada = Boolean(venta.factura_id) && venta.facturas?.estado === "emitida";
          const seleccionable = !venta.factura_id;
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${
              seleccionable
                ? `<input type="checkbox" class="venta-checkbox" data-id="${venta.id}" aria-label="Seleccionar venta" />`
                : ""
            }</td>
            <td>${venta.fecha}</td>
            <td>${venta.descripcion}</td>
            <td>${venta.cantidad}</td>
            <td>$${venta.precio_unitario}</td>
            <td>$${venta.precio_total}</td>
            <td><span class="table-icon-cell">${venta.modo_pago === "tarjeta" ? icons.card : icons.cash} ${
              venta.modo_pago === "tarjeta" ? "Tarjeta" : "Efectivo"
            }</span></td>
            <td><span class="status ${facturada ? "facturada" : "no-facturada"}">${icons.dot} ${
              facturada ? "Facturada" : "No facturada"
            }</span></td>
          `;
          tbody.appendChild(tr);
        }
        ventasFooterEl.textContent = `Mostrando ${ventas.length} ${ventas.length === 1 ? "venta" : "ventas"}`;
      }

      tbody.addEventListener("change", (event) => {
        const checkbox = event.target.closest(".venta-checkbox");
        if (!checkbox) return;
        if (checkbox.checked) {
          seleccionadas.add(checkbox.dataset.id);
        } else {
          seleccionadas.delete(checkbox.dataset.id);
        }
        actualizarBarraSeleccion();
      });

      selectAllCheckbox.addEventListener("change", () => {
        const checkboxes = tbody.querySelectorAll(".venta-checkbox");
        for (const checkbox of checkboxes) {
          checkbox.checked = selectAllCheckbox.checked;
          if (selectAllCheckbox.checked) {
            seleccionadas.add(checkbox.dataset.id);
          } else {
            seleccionadas.delete(checkbox.dataset.id);
          }
        }
        actualizarBarraSeleccion();
      });

      generarBorradorBtn.addEventListener("click", async () => {
        const textoOriginal = generarBorradorBtn.innerHTML;
        generarBorradorBtn.disabled = true;
        generarBorradorBtn.textContent = "Generando…";
        try {
          const resultado = await ventasService.generarBorradorManual([...seleccionadas]);
          feedbackEl.hidden = false;
          if (resultado.facturas_generadas > 0) {
            feedbackEl.textContent = `Se generó ${resultado.facturas_generadas} ${
              resultado.facturas_generadas === 1 ? "factura borrador" : "facturas borrador"
            } (una por modo de pago). Confirmalas desde Facturas.${
              resultado.ventas_omitidas?.length
                ? ` ${resultado.ventas_omitidas.length} venta(s) ya no estaban disponibles y no se incluyeron.`
                : ""
            }`;
          } else {
            feedbackEl.textContent = resultado.message || "No se pudo generar el borrador.";
          }
          await cargarVentas();
          await cargarStats();
        } catch (err) {
          pageErrorEl.textContent = "No se pudo generar el borrador por un error de conexión. Volvé a intentar.";
          pageErrorEl.hidden = false;
        } finally {
          generarBorradorBtn.disabled = false;
          generarBorradorBtn.innerHTML = textoOriginal;
        }
      });

      const pageErrorEl = document.getElementById("page-error");

      async function cargarVentas() {
        try {
          const { data, error } = await ventasService.listarVentas(localId, {
            desde: filtrosForm.desde.value || undefined,
            hasta: filtrosForm.hasta.value || undefined,
            modoPago: filtrosForm.modoPago.value || undefined,
            estado: filtrosForm.estado.value || undefined,
          });
          if (error) throw error;
          pageErrorEl.hidden = true;
          renderVentas(data);
        } catch (err) {
          pageErrorEl.textContent = "No se pudo cargar el listado de ventas. Volvé a intentar en unos segundos.";
          pageErrorEl.hidden = false;
        }
      }

      // Tarjetas de resumen: siempre sobre el total de ventas del local,
      // independiente de los filtros del listado de abajo.
      async function cargarStats() {
        const { data } = await ventasService.listarVentas(localId, {});
        const hoy = new Date().toISOString().slice(0, 10);
        const stats = computeStats(data, hoy);
        document.getElementById("stat-hoy-monto").textContent = `$${stats.hoy.monto}`;
        document.getElementById("stat-hoy-cantidad").textContent = `${stats.hoy.cantidad} ${
          stats.hoy.cantidad === 1 ? "venta" : "ventas"
        }`;
        document.getElementById("stat-mes-monto").textContent = `$${stats.mes.monto}`;
        document.getElementById("stat-mes-cantidad").textContent = `${stats.mes.cantidad} ${
          stats.mes.cantidad === 1 ? "venta" : "ventas"
        }`;
        document.getElementById("stat-pendientes").textContent = stats.pendientes;
      }

      const filtrosForm = document.getElementById("filtros-form");
      filtrosForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        await cargarVentas();
      });

      await cargarVentas();
      await cargarStats();
    </script>
  </body>
</html>
