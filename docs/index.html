<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="container" style="max-width: 420px; margin-top: 10vh">
      <div class="card">
        <h1>Iniciar sesión</h1>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p id="login-error" class="error-message" role="alert" hidden></p>
          <button type="submit" class="primary">Ingresar</button>
        </form>
        <p><a href="./recuperar-password.html">Olvidé mi contraseña</a></p>
      </div>
    </main>

    <script type="module">
      import { sb } from "./js/supabaseClient.js";
      import { createAuthService } from "./js/auth.js";

      const auth = createAuthService(sb);
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("login-error");

      // Si ya hay sesión iniciada, no mostrar el login de nuevo.
      const existingSession = await auth.requireSession();
      if (existingSession) {
        window.location.href = "./ventas.html";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.hidden = true;

        const username = form.username.value;
        const password = form.password.value;
        const { user, error } = await auth.login(username, password);

        if (error || !user) {
          errorEl.textContent =
            "Usuario o contraseña incorrectos. Volvé a intentar.";
          errorEl.hidden = false;
          return;
        }

        window.location.href = "./ventas.html";
      });
    </script>
  </body>
</html>
